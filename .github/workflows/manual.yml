name: Deploy Unstable Manual

on:
  workflow_run:
    workflows:
      - Build
    branches:
      - main
    types:
      - completed
jobs:
  deploy-unstable:
    name: Deploy

    runs-on: ubuntu-latest
    if: github.repository == 'zhaofengli/colmena'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        continue-on-error: true # Self-hosted runners already have Nix installed

      - name: Enable Binary Cache
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: colmena
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # == Manual
      - name: Build manual
        run: nix build .#manual -L

      - name: Deploy manual
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: result
          target-folder: unstable

      # == Redirect Farm
      # /future_api_version -> /unstable
      - name: Check future API version
        run: echo "api_version=$(nix eval .#colmena.apiVersion)" >> $GITHUB_ENV

      - name: Build redirect farm
        run: nix build .#manual.redirectFarm -L

      - name: Deploy redirect farm
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: result-redirectFarm
          target-folder: '${{ env.api_version }}'
